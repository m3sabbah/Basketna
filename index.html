<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="سلتنا">

<title>سلتنا Basket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF5F0; --card:#FFFFFF; --ink:#133A3F; --muted:#4F6C6E; --line:#D3E3DA;
  --green:#178A55; --green-soft:#D8F0E3; --on-green:#FFFFFF;
  --saffron:#F5A623; --saffron-soft:#FDEBC8;
  --teal:#1E5F74; --teal-soft:#D6E9F0; --on-teal:#FFFFFF;
  --danger:#C23B34; --danger-soft:#FBE3E1; --shadow:rgba(19,58,63,.10);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1D20; --card:#16292D; --ink:#E6F2EE; --muted:#9BB6B4; --line:#27413F;
    --green:#3FC184; --green-soft:#17382B; --on-green:#07271A;
    --saffron:#F7B744; --saffron-soft:#3B2D12;
    --teal:#5DB7D4; --teal-soft:#14343F; --on-teal:#06232C;
    --danger:#EF7A72; --danger-soft:#3D1D1B; --shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1D20; --card:#16292D; --ink:#E6F2EE; --muted:#9BB6B4; --line:#27413F;
  --green:#3FC184; --green-soft:#17382B; --on-green:#07271A;
  --saffron:#F7B744; --saffron-soft:#3B2D12;
  --teal:#5DB7D4; --teal-soft:#14343F; --on-teal:#06232C;
  --danger:#EF7A72; --danger-soft:#3D1D1B; --shadow:rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif; font-size:16px; line-height:1.5;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain;
  --accent:var(--green); --accent-soft:var(--green-soft); --on-accent:var(--on-green);
}
body[data-role="mama"]{--accent:var(--saffron); --accent-soft:var(--saffron-soft); --on-accent:#2b1c00}
body[data-role="servant"]{--accent:var(--green); --accent-soft:var(--green-soft); --on-accent:var(--on-green)}
body[data-role="baba"]{--accent:var(--teal); --accent-soft:var(--teal-soft); --on-accent:var(--on-teal)}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none; padding:0}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
#app{max-width:980px; margin:0 auto; padding:0 16px 120px}

/* header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; display:flex; align-items:center; gap:12px; padding:12px 0; background:var(--bg)}
.top h2{margin:0; flex:1; font-size:21px; font-weight:800; line-height:1.2}
.top h2 small{display:block; color:var(--muted); font-size:12.5px; font-weight:600; margin-top:2px}
.ib{width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:14px; background:var(--card); border:1px solid var(--line); color:var(--ink)}
.ib.dn{color:var(--danger)}
.ib.big{width:54px; height:54px; font-size:28px; font-weight:700}

/* buttons */
.btn{min-height:48px; padding:0 20px; border-radius:14px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent}
.btn.pri{background:var(--accent); color:var(--on-accent)}
.btn.ghost{background:var(--card); border-color:var(--line)}
.btn.danger{background:var(--danger-soft); color:var(--danger)}
.btn.sm{min-height:40px; padding:0 14px; font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}

/* home */
.hero{text-align:center; padding:28px 0 18px}
.hero svg{width:112px; height:112px}
.hero h1{margin:6px 0 0; font-size:44px; line-height:1.1; font-weight:800; letter-spacing:0}
.hero .en{margin:0; font-size:20px; font-weight:700; color:var(--muted); direction:ltr}
.hero p.tag{margin:10px 0 0; color:var(--muted)}
.roles{display:grid; gap:14px; margin-top:20px}
@media(min-width:700px){.roles{grid-template-columns:repeat(3,1fr)}}
.role{position:relative; display:flex; align-items:center; gap:14px; text-align:start; padding:18px; border-radius:22px; background:var(--card); border:2px solid var(--line); box-shadow:0 6px 18px var(--shadow)}
@media(min-width:700px){.role{flex-direction:column; align-items:flex-start; padding:22px; min-height:190px}}
.role .ico{width:64px; height:64px; border-radius:20px; display:grid; place-items:center; font-size:34px; flex:none}
.role b{display:block; font-size:20px; line-height:1.2}
.role small{display:block; color:var(--muted); font-size:13.5px; margin-top:2px}
.role.mama{border-color:var(--saffron)} .role.mama .ico{background:var(--saffron-soft)}
.role.servant{border-color:var(--green)} .role.servant .ico{background:var(--green-soft)}
.role.baba{border-color:var(--teal)} .role.baba .ico{background:var(--teal-soft)}
.role .lk{position:absolute; top:14px; inset-inline-end:14px; color:var(--muted)}
.note{margin:22px 0 0; padding:12px 14px; border-radius:14px; background:var(--card); border:1px dashed var(--line); color:var(--muted); font-size:14px; text-align:center}
.note.warn{border-color:var(--danger); color:var(--danger)}

/* login */
.panel{max-width:440px; margin:10px auto 0; padding:22px; background:var(--card); border-radius:22px; border:1px solid var(--line); box-shadow:0 6px 18px var(--shadow)}
.panel h3{margin:0 0 4px; font-size:20px}
.panel p{margin:0 0 16px; color:var(--muted)}

/* forms */
.field{display:block; margin-bottom:14px}
.field>span{display:block; font-weight:700; font-size:14px; margin-bottom:6px}
.field input,.field select{width:100%; min-height:48px; padding:0 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); font-size:16px}
.field input:focus,.field select:focus{border-color:var(--accent); outline:none}
.acts{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px}
.acts .btn{flex:1 1 120px}

/* search + chips */
.search{display:flex; align-items:center; gap:10px; padding:0 14px; min-height:50px; border-radius:16px; background:var(--card); border:1.5px solid var(--line); color:var(--muted)}
.search input{flex:1; min-width:0; border:0; background:none; font-size:16px; outline:none; color:var(--ink); height:48px}
.chips{display:flex; gap:8px; overflow-x:auto; padding:12px 0 6px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; min-height:40px; padding:0 15px; border-radius:999px; background:var(--card); border:1.5px solid var(--line); font-weight:600; font-size:15px; white-space:nowrap}
.chip.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

/* thumbs */
.thumb{width:56px; height:56px; flex:none; border-radius:16px; background:var(--accent-soft); display:grid; place-items:center; overflow:hidden; font-size:30px; line-height:1}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.thumb.sm{width:44px; height:44px; font-size:24px; border-radius:13px}
.thumb.big{width:84px; height:84px; font-size:44px; border-radius:22px}

/* lists */
.gt{margin:22px 0 10px; font-size:17px; font-weight:800; display:flex; align-items:center; gap:8px}
.gt span{font-size:20px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(138px,1fr)); gap:12px}
.pcard{position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 10px 14px; border-radius:20px; background:var(--card); border:2px solid var(--line); text-align:center; min-height:150px}
.pcard .thumb{width:72px; height:72px; font-size:38px; border-radius:20px}
.pcard b{font-size:15.5px; line-height:1.25}
.pcard small{display:block; color:var(--muted); font-size:12.5px}
.pcard.in{border-color:var(--accent); background:var(--accent-soft)}
.badge{position:absolute; top:8px; inset-inline-start:8px; background:var(--accent); color:var(--on-accent); font-size:12.5px; font-weight:700; padding:2px 10px; border-radius:999px}
.nm{flex:1; min-width:0}
.nm b{display:block; font-size:16.5px; line-height:1.3}
.nm small{display:block; color:var(--muted); font-size:13px; line-height:1.3}
.nm em{display:block; font-style:normal; color:var(--muted); font-size:12.5px}
.row{display:flex; align-items:center; gap:12px; padding:10px 12px; margin-bottom:10px; border-radius:18px; background:var(--card); border:1px solid var(--line)}
.row .q{font-weight:700; color:var(--accent); background:var(--accent-soft); padding:4px 12px; border-radius:999px; font-size:14px; white-space:nowrap}
.cats{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:12px}
.ccard{display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px 10px 12px; border-radius:20px; background:var(--card); border:1px solid var(--line); text-align:center}
.ccard .thumb{width:68px; height:68px; font-size:36px}
.ccard .nm{flex:none; width:100%}
.ccard .btns{display:flex; gap:8px; margin-top:6px}
.empty{text-align:center; padding:48px 16px; color:var(--muted)}
.empty .big{font-size:56px; line-height:1.2}
.empty h3{margin:8px 0 4px; color:var(--ink)}
.empty .btn{margin-top:14px}

/* bars */
.bar{position:fixed; inset-inline:0; bottom:0; z-index:20; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar .btn{max-width:640px; margin:0 auto; display:flex}
.count{background:var(--on-accent); color:var(--accent); min-width:26px; height:26px; border-radius:999px; display:inline-grid; place-items:center; font-size:14px; padding:0 8px}
.nav{position:fixed; inset-inline:0; bottom:0; z-index:20; display:flex; justify-content:center; gap:6px; padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px)); background:var(--card); border-top:1px solid var(--line)}
.nav button{flex:1; max-width:220px; min-height:54px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:14px; font-size:13px; font-weight:700; color:var(--muted)}
.nav button.on{background:var(--accent-soft); color:var(--ink)}
.fab{position:fixed; inset-inline-end:16px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:21; min-height:56px; padding:0 22px; border-radius:18px; background:var(--accent); color:var(--on-accent); font-weight:800; display:flex; align-items:center; gap:8px; box-shadow:0 8px 20px var(--shadow)}

/* baba */
.prog{padding:18px; border-radius:22px; background:var(--card); border:1px solid var(--line); margin-top:4px}
.prog .ptop{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.prog .pct{font-size:40px; font-weight:800; line-height:1; color:var(--accent)}
.prog span{color:var(--muted); font-weight:600}
.track{height:16px; margin-top:12px; border-radius:999px; background:var(--accent-soft); overflow:hidden}
.track i{display:block; height:100%; border-radius:999px; background:var(--accent); transition:width .35s ease}
.done-msg{margin-top:14px; padding:14px; border-radius:16px; background:var(--green-soft); color:var(--ink); text-align:center; font-weight:700}
.grp{margin-top:12px; border-radius:20px; background:var(--card); border:1.5px solid var(--line); overflow:hidden}
.grp.full{border-color:var(--green)}
.gh{width:100%; display:flex; align-items:center; gap:12px; padding:12px; text-align:start}
.gh .cnt{font-weight:800; color:var(--muted); font-size:14px; white-space:nowrap}
.grp.full .gh .cnt{color:var(--green)}
.chev{transition:transform .2s ease; color:var(--muted); display:grid}
.chev.up{transform:rotate(180deg)}
.grp ul{list-style:none; margin:0; padding:0}
.gb{padding:0 12px 10px}
.grp .row{border:0; border-top:1px solid var(--line); border-radius:0; margin:0; background:none; padding:10px 0}
.grp .grid{padding-top:6px}
.nm small.br,.pcard small.br{display:inline-block; margin-top:3px; padding:0 9px; border-radius:8px; background:var(--card); border:1px solid var(--line); color:var(--ink); font-size:12.5px; font-weight:600}
.irow{width:100%; display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); text-align:start}
.irow .cb{width:32px; height:32px; flex:none; border-radius:50%; border:2.5px solid var(--muted); display:grid; place-items:center; color:var(--on-accent)}
.irow.done .cb{background:var(--green); border-color:var(--green); color:var(--on-green)}
.irow.done .nm{opacity:.55; text-decoration:line-through}
.irow .q{font-weight:700; color:var(--muted); font-size:14px; white-space:nowrap}

/* modal */
.ov{position:fixed; inset:0; z-index:50; background:rgba(5,20,22,.55); display:flex; align-items:flex-end; justify-content:center}
.sheet{width:100%; max-width:520px; max-height:92%; overflow:auto; background:var(--card); border-radius:26px 26px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px)); animation:up .22s ease}
.sheet h3{margin:0 0 16px; font-size:20px}
@keyframes up{from{transform:translateY(24px); opacity:0}to{transform:none; opacity:1}}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px}}
.imgpick{display:flex; align-items:center; gap:14px; margin-bottom:16px}
.imgpick>div{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
.stepper{display:flex; align-items:center; gap:12px; margin:8px 0 16px}
.stepper input{flex:1; min-width:0; height:54px; text-align:center; font-size:26px; font-weight:800; border-radius:14px; border:1.5px solid var(--line); background:var(--bg)}
.units{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
.qhead{display:flex; align-items:center; gap:14px; margin-bottom:12px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom,0px)); z-index:60; max-width:90%; padding:12px 18px; border-radius:14px; background:var(--ink); color:var(--bg); font-weight:600; text-align:center}
.loading{display:grid; place-items:center; min-height:50vh; color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

const catOf=id=>S.catalog.cats.find(c=>c.id===id);
const fmt=n=>String(Math.round(n*100)/100);

/* ---------- التخزين ---------- */
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS));if(j&&j.catalog)S=Object.assign(S,j)}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('المساحة ممتلئة، جرّب صورًا أصغر')}}
function persist(path,data){
  render();
  if(!db){saveLocal();return}
  const run=()=>data===null?db.doc(path).delete():db.doc(path).set(data);
  Q[path]=(Q[path]||Promise.resolve()).then(run).catch(e=>{
    console.error(e);
    toast(e&&e.code==='permission-denied'?'رُفض الحفظ. راجع قواعد الأمان في Firebase.':'تعذّر الحفظ، حاول مرة أخرى');
  });
}
const setCatalog=c=>{S.catalog=c;persist('catalog/main',c)};
const setSettings=o=>{S.settings=o;persist('settings/main',o)};
function setCart(id,it){if(it)S.cart[id]=it;else delete S.cart[id];persist('cart/'+id,it||null)}
function setImg(id,img){if(img)S.pimg[id]=img;else delete S.pimg[id];persist('pimg/'+id,img?{img}:null)}

async function hash(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('basket:'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=0;const t='basket:'+s;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return 'x'+h}
}
const whenReady=()=>new Promise(r=>{const t=Date.now();(function w(){if(initDone&&(!db||(loaded.catalog&&loaded.settings))||Date.now()-t>6000)r();else setTimeout(w,100)})()});

function seedDefaults(){
  const cats=[],prods=[];let n=0;
  SEED.forEach((g,i)=>{
    const cid='c'+(i+1);cats.push({id:cid,ar:g[0],en:g[1],emoji:g[2]});
    g[3].split(';').forEach(s=>{const a=s.split('|');prods.push({id:'p'+(++n),ar:a[0],en:a[1],emoji:a[2],cat:cid})});
  });
  setCatalog({cats,prods});
  setSettings(Object.assign({},S.settings,{seeded:true}));
}

/* ---------- الاتصال ---------- */
async function init(){
  draw();
  try{
    if(window.firebase){
      firebase.initializeApp(FIREBASE_CONFIG);
      db=firebase.firestore();
    }
  }catch(e){console.error(e);db=null}
  if(db){
    mode='sync';
    const err=e=>{console.error(e);mode='local-err';render()};
    db.doc('catalog/main').onSnapshot(s=>{
      const d=s.exists?clone(s.data()):{};
      S.catalog={cats:d.cats||[],prods:d.prods||[]};loaded.catalog=true;render();
    },err);
    db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?clone(s.data()):{};loaded.settings=true;render()},err);
    db.collection('cart').onSnapshot(q=>{const c={};q.docs.forEach(d=>{c[d.id]=clone(d.data())});S.cart=c;render()},err);
    db.collection('pimg').onSnapshot(q=>{const c={};q.docs.forEach(d=>{c[d.id]=d.data().img});S.pimg=c;render()},err);
  }else{mode='local';loadLocal()}
  initDone=true;render();
}

function render(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;draw()})}
function draw(){
  const a=document.activeElement;
  if(a&&a.id==='q'&&V.role==='servant'&&V.view==='app'){drawList();return}
  document.body.dataset.role=(V.view==='home')?'':(V.role||V.target||'');
  let h;
  if(V.view==='home')h=homeV();
  else if(V.view==='login')h=loginV();
  else if(V.role==='mama')h=mamaV();
  else if(V.role==='servant')h=V.view==='cart'?cartV():servantV();

  $('#app').innerHTML=h;

}

function drawList(){
  const L=$('#list');if(!L)return;
  const q=norm(V.q.trim());
  const match=p=>!q||norm((p.ar||'')+' '+(p.en||'')+' '+(p.brand||'')).indexOf(q)>=0;
  if(!S.catalog.prods.length)L.innerHTML=empty('🧺','لا توجد منتجات بعد','تضيف ربة المنزل المنتجات، وستظهر هنا.');
  else{
    const html=S.catalog.cats.map(c=>{
      const all=S.catalog.prods.filter(p=>p.cat===c.id),ps=all.filter(match);
      if(!ps.length)return '';
      const open=q?true:!!V.open[c.id],inc=ps.filter(p=>S.cart[p.id]).length;
      return grpHtml(c,inc?inc+' في السلة':String(all.length),open,`<div class="grid">${ps.map(pcard).join('')}</div>`,inc>0);
    }).join('');
    L.innerHTML=html||empty('🔍','لا توجد نتائج','جرّب كلمة أخرى.');
  }
  const bar=$('#bar');
  if(bar)bar.innerHTML=`<div class="bar"><button class="btn pri wide" data-act="cart">${ic('cart')}<span>عرض السلة</span><span class="count">${cartItems().length}</span></button></div>`;
}

function babaV(){
  const items=cartItems(),total=items.length,done=items.filter(x=>x.it.done).length,pct=total?Math.round(done/total*100):0;
  let h=top('رب المنزل','Baba','home');

  h+=`<div class="prog"><div class="ptop"><b class="pct">${pct}%</b><span>تم توفير ${done} من ${total}</span></div><div class="track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  ${pct===100?`<div class="done-msg">اكتملت المشتريات 🎉</div><button class="btn pri wide" style="margin-top:12px" data-act="finish">إنهاء وبدء قائمة جديدة</button>`:''}</div>`;
  h+=S.catalog.cats.map(c=>{
    const l=items.filter(x=>x.p.cat===c.id);if(!l.length)return '';
    const d=l.filter(x=>x.it.done).length,open=!!V.open[c.id];
    const inner=`<ul>${l.map(x=>`<li><button class="irow${x.it.done?' done':''}" data-act="tog" data-id="${x.id}" aria-pressed="${!!x.it.done}"><span class="cb">${x.it.done?ic('check',18):''}</span><span class="thumb sm">${prodPic(x.p)}</span><span class="nm">${nameHtml(x.p)}</span><span class="q">${esc(qtyLabel(x.it))}</span></button></li>`).join('')}</ul>`;
    return grpHtml(c,d+'/'+l.length,open,inner,d===l.length);
  }).join('');
  return h;
}

function openModal(html){

  const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal()});
  $('#modal').appendChild(ov);
  const f=ov.querySelector('input:not([type=file]):not([type=hidden])');if(f&&f.type!=='number')setTimeout(()=>f.focus(),60);
  return ov;
}
function closeModal(){$('#modal').innerHTML=''}
function ask(msg,label,fn){
  openModal(`<h3>${esc(msg)}</h3><div class="acts"><button class="btn danger" id="yes">${esc(label)}</button><button class="btn ghost" data-act="close">إلغاء</button></div>`);
  $('#yes').onclick=()=>{closeModal();fn()};
}
let tt=0;
function toast(m){const t=$('#toast');t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>{t.innerHTML=''},3200)}

function shrink(file,max){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=max;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,max,max);
      x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,max,max);res(c.toDataURL('image/jpeg',.72))};
      im.onerror=rej;im.src=r.result};
    r.onerror=rej;r.readAsDataURL(file);
  });
}
function imgPicker(emojiFn){
  return `<div class="imgpick"><span class="thumb big" id="pv"></span><div>
   <label class="btn ghost sm">${ic('img',18)} اختيار صورة<input type="file" id="file" accept="image/*" hidden></label>
   <button type="button" class="btn ghost sm" id="noimg">إزالة الصورة</button></div></div>`;
}
function wirePicker(f,emojiKey){
  const pv=$('#pv');
  const paint=()=>{pv.innerHTML=pend.img?`<img src="${pend.img}" alt="">`:`<span>${esc((f.emoji&&f.emoji.value.trim())||pend.fallback||'🛒')}</span>`};
  paint();
  if(f.emoji)f.emoji.addEventListener('input',paint);
  $('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{pend.img=await shrink(file,180);paint()}catch(x){toast('تعذّرت قراءة الصورة')}};
  $('#noimg').onclick=()=>{pend.img=null;paint()};
}

function productForm(id,preCat){
  const p=id?prod(id):null;
  if(!S.catalog.cats.length){toast('أضف قسمًا أولًا');return}
  const openCat=Object.keys(V.open).find(k=>V.open[k]&&catOf(k));
  const defCat=p?p.cat:(preCat&&catOf(preCat)?preCat:(openCat||S.catalog.cats[0].id));
  pend={img:p&&okImg(S.pimg[id])?S.pimg[id]:null,orig:p&&okImg(S.pimg[id])?S.pimg[id]:null,fallback:(catOf(defCat)||{}).emoji};
  openModal(`<h3>${p?'تعديل المنتج':'إضافة منتج'}</h3><form id="f">${imgPicker()}
   <label class="field"><span>الاسم بالعربية</span><input name="ar" dir="auto" placeholder="مثال: طماطم" value="${esc(p&&p.ar)}"></label>
   <label class="field"><span>الاسم بالإنجليزية</span><input name="en" dir="auto" placeholder="e.g. Tomato" value="${esc(p&&p.en)}"></label>
   <label class="field"><span>الشركة / العلامة التجارية (اختياري)</span><input name="brand" dir="auto" list="brands" placeholder="مثال: المراعي · Almarai" value="${esc(p&&p.brand)}"><datalist id="brands">${Array.from(new Set(S.catalog.prods.map(x=>x.brand).filter(Boolean))).map(b=>`<option value="${esc(b)}">`).join('')}</datalist></label>
   <label class="field"><span>القسم</span><select name="cat">${S.catalog.cats.map(c=>`<option value="${c.id}"${c.id===defCat?' selected':''}>${esc((c.emoji||'')+' '+(c.ar||c.en))}</option>`).join('')}</select></label>
   <label class="field"><span>رمز تعبيري (يظهر إن لم تضف صورة)</span><input name="emoji" maxlength="6" placeholder="🍅" value="${esc(p&&p.emoji)}"></label>
   <div class="acts"><button class="btn pri">حفظ</button><button type="button" class="btn ghost" data-act="close">إلغاء</button></div></form>`);
  const f=$('#f');wirePicker(f);
  f.onsubmit=e=>{
    e.preventDefault();
    const ar=f.ar.value.trim(),en=f.en.value.trim();
    if(!ar&&!en){toast('اكتب اسم المنتج بالعربية أو الإنجليزية');return}
    const d={ar,en,brand:f.brand.value.trim(),cat:f.cat.value,emoji:f.emoji.value.trim()};
    const c=clone(S.catalog);let pid=id;
    if(id){const i=c.prods.findIndex(x=>x.id===id);c.prods[i]=Object.assign({},c.prods[i],d)}
    else{pid=uid();c.prods.push(Object.assign({id:pid},d))}
    setCatalog(c);
    if((pend.img||null)!==(pend.orig||null))setImg(pid,pend.img);
    closeModal();toast(id?'تم حفظ التعديل':'تمت إضافة المنتج');
  };
}
function categoryForm(id){
  const c0=id?catOf(id):null;
  pend={img:c0&&okImg(S.pimg[id])?S.pimg[id]:null,orig:c0&&okImg(S.pimg[id])?S.pimg[id]:null,fallback:'🗂️'};
  openModal(`<h3>${c0?'تعديل القسم':'إضافة قسم'}</h3><form id="f">${imgPicker()}
   <label class="field"><span>الاسم بالعربية</span><input name="ar" dir="auto" placeholder="مثال: خضروات" value="${esc(c0&&c0.ar)}"></label>
   <label class="field"><span>الاسم بالإنجليزية</span><input name="en" dir="auto" placeholder="e.g. Vegetables" value="${esc(c0&&c0.en)}"></label>
   <label class="field"><span>رمز تعبيري (يظهر إن لم تضف صورة)</span><input name="emoji" maxlength="6" placeholder="🥦" value="${esc(c0&&c0.emoji)}"></label>
   <div class="acts"><button class="btn pri">حفظ</button><button type="button" class="btn ghost" data-act="close">إلغاء</button></div></form>`);
  const f=$('#f');wirePicker(f);
  f.onsubmit=e=>{
    e.preventDefault();
    const ar=f.ar.value.trim(),en=f.en.value.trim();
    if(!ar&&!en){toast('اكتب اسم القسم بالعربية أو الإنجليزية');return}
    const d={ar,en,emoji:f.emoji.value.trim()};
    const c=clone(S.catalog);let cid=id;
    if(id){const i=c.cats.findIndex(x=>x.id===id);c.cats[i]=Object.assign({},c.cats[i],d)}
    else{cid=uid();c.cats.push(Object.assign({id:cid},d))}
    setCatalog(c);
    if((pend.img||null)!==(pend.orig||null))setImg(cid,pend.img);
    closeModal();toast(id?'تم حفظ التعديل':'تمت إضافة القسم');
  };
}
function deleteProduct(id){
  const p=prod(id);if(!p)return;
  ask(`حذف «${p.ar||p.en}»؟`,'حذف',()=>{
    const c=clone(S.catalog);c.prods=c.prods.filter(x=>x.id!==id);setCatalog(c);
    if(S.cart[id])setCart(id,null);
    if(S.pimg[id])setImg(id,null);
    toast('تم حذف المنتج');
  });
}
function deleteCategory(id){
  const c0=catOf(id);if(!c0)return;
  const ps=S.catalog.prods.filter(p=>p.cat===id);
  ask(`حذف قسم «${c0.ar||c0.en}»${ps.length?` مع ${ps.length} منتج`:''}؟`,'حذف',()=>{
    const c=clone(S.catalog);c.cats=c.cats.filter(x=>x.id!==id);c.prods=c.prods.filter(x=>x.cat!==id);setCatalog(c);
    ps.forEach(p=>{if(S.cart[p.id])setCart(p.id,null);if(S.pimg[p.id])setImg(p.id,null)});
    if(S.pimg[id])setImg(id,null);
    if(V.cat===id)V.cat='all';
    toast('تم حذف القسم');
  });
}
function defaultUnit(p){
  const c=catOf(p.cat)||{};
  if(/خضر|فواك|لحوم|أسماك/.test(c.ar||''))return 'kg';
  if(/عصائر/.test(c.ar||'')||/حليب|زيت|مياه/.test(p.ar||''))return 'liter';
  if(/معلبات|حبوب|ألبان/.test(c.ar||''))return 'pack';
  return 'piece';
}
const stepOf=u=>(u==='kg'||u==='liter')?0.5:1;
function qtyForm(id){
  const p=prod(id);if(!p)return;
  const it=S.cart[id];
  M={id,unit:(it&&UNITS[it.unit])?it.unit:defaultUnit(p)};
  const units=()=>Object.keys(UNITS).map(k=>`<button type="button" class="chip${k===M.unit?' on':''}" data-act="unit" data-u="${k}">${UNITS[k]}</button>`).join('');
  openModal(`<div class="qhead"><span class="thumb big">${prodPic(p)}</span><div class="nm">${nameHtml(p)}</div></div>
   <div class="stepper"><button type="button" class="ib big" data-act="inc" aria-label="زيادة">+</button><input id="qty" type="number" inputmode="decimal" min="0" step="any" value="${it?it.qty:1}" aria-label="الكمية"><button type="button" class="ib big" data-act="dec" aria-label="إنقاص">−</button></div>
   <div class="units" id="units">${units()}</div>
   <div class="acts"><button class="btn pri" data-act="okq">${it?'حفظ التعديل':'أضف إلى السلة'}</button>${it?'<button class="btn danger" data-act="rmq">حذف من السلة</button>':''}<button class="btn ghost" data-act="close">إلغاء</button></div>`);
}
function pwForm(){
  openModal(`<h3>تغيير كلمة المرور</h3><form id="f">
   <label class="field"><span>كلمة المرور الحالية</span><input name="cur" type="password" autocomplete="current-password" required></label>
   <label class="field"><span>كلمة المرور الجديدة</span><input name="n1" type="password" autocomplete="new-password" required></label>
   <label class="field"><span>أعد كتابة الجديدة</span><input name="n2" type="password" autocomplete="new-password" required></label>
   <div class="acts"><button class="btn pri">حفظ</button><button type="button" class="btn ghost" data-act="close">إلغاء</button></div></form>`);
  const f=$('#f');
  f.onsubmit=async e=>{
    e.preventDefault();
    if(await hash(f.cur.value)!==S.settings.pw){toast('كلمة المرور الحالية غير صحيحة');return}
    if(f.n1.value.length<4){toast('كلمة المرور لا تقل عن 4 أحرف');return}
    if(f.n1.value!==f.n2.value){toast('كلمتا المرور غير متطابقتين');return}
    setSettings(Object.assign({},S.settings,{pw:await hash(f.n1.value)}));
    closeModal();toast('تم تغيير كلمة المرور');
  };
}

/* ---------- الأحداث ---------- */
function act(a,d){
  const ae=document.activeElement;if(ae&&ae.blur&&ae.id==='q')ae.blur();
  switch(a){
    case 'close':closeModal();break;
    case 'home':V.view='home';V.role=null;V.target=null;V.open={};render();break;
    case 'role':{
      const r=d.r;V.open={};
      if(r==='servant'){V.role='servant';V.view='app';V.q='';V.cat='all'}
      else if(V.authed[r]){V.role=r;V.view='app';V.tab='products';V.cat='all'}
      else{V.target=r;V.view='login'}
      render();break}
    case 'tab':V.tab=d.t;V.open={};render();break;
    case 'cat':V.cat=(V.cat===d.id&&d.id!=='all')?'all':d.id;render();break;
    case 'addP':productForm(undefined,d.cat);break;
    case 'editP':productForm(d.id);break;
    case 'delP':deleteProduct(d.id);break;
    case 'addC':categoryForm();break;
    case 'editC':categoryForm(d.id);break;
    case 'delC':deleteCategory(d.id);break;
    case 'seed':if(!S.catalog.cats.length){seedDefaults();toast('تمت إضافة القوائم المبدئية')}break;
    case 'chpw':pwForm();break;
    case 'logout':V.authed[V.role]=false;V.view='home';V.role=null;render();break;
    case 'pick':qtyForm(d.id);break;
    case 'unit':{M.unit=d.u;const qi=$('#qty');if(qi&&(!qi.value||+qi.value<=0))qi.value=1;$('#units').innerHTML=Object.keys(UNITS).map(k=>`<button type="button" class="chip${k===M.unit?' on':''}" data-act="unit" data-u="${k}">${UNITS[k]}</button>`).join('');break}
    case 'inc':case 'dec':{
      const qi=$('#qty'),s=stepOf(M.unit);let v=parseFloat(qi.value)||0;
      v=a==='inc'?v+s:v-s;if(v<=0)v=s;qi.value=fmt(v);break}
    case 'okq':{
      const v=parseFloat($('#qty').value);
      if(!(v>0)){toast('اكتب كمية أكبر من صفر');return}
      const old=S.cart[M.id];
      setCart(M.id,{qty:v,unit:M.unit,done:old?!!old.done:false});
      closeModal();toast(old?'تم تعديل الكمية':'أضيف إلى السلة');break}
    case 'rmq':setCart(M.id,null);closeModal();toast('حُذف من السلة');break;
    case 'rm':setCart(d.id,null);toast('حُذف من السلة');break;
    case 'cart':V.view='cart';render();window.scrollTo(0,0);break;
    case 'toapp':V.view='app';render();break;
    case 'open':V.open[d.id]=!V.open[d.id];render();break;
    case 'tog':{const it=S.cart[d.id];if(it)setCart(d.id,Object.assign({},it,{done:!it.done}));break}
    case 'finish':ask('إنهاء المشتريات وتفريغ السلة؟','إنهاء',()=>{Object.keys(S.cart).forEach(id=>setCart(id,null));V.open={};toast('السلة جاهزة لقائمة جديدة')});break;
  }
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)act(t.dataset.act,t.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;drawList()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='lf')return;
  e.preventDefault();
  const f=e.target,pw=f.pw.value;
  if(!pw){toast('اكتب كلمة المرور');return}
  await whenReady();
  if(!S.settings.pw){
    if(V.target!=='mama')return;
    if(pw.length<4){toast('كلمة المرور لا تقل عن 4 أحرف');return}
    if(f.pw2&&pw!==f.pw2.value){toast('كلمتا المرور غير متطابقتين');return}
    setSettings(Object.assign({},S.settings,{pw:await hash(pw)}));
  }else if(await hash(pw)!==S.settings.pw){toast('كلمة المرور غير صحيحة');f.pw.value='';return}
  V.authed[V.target]=true;V.role=V.target;V.view='app';V.tab='products';V.cat='all';
  if(V.role==='mama'&&!S.catalog.cats.length&&!S.settings.seeded)seedDefaults();
  render();
});

init();
})();
</script>
</body>
</html>
